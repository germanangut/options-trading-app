services:
  - type: web
    runtime: docker
    name: options-trading-backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: options-trading-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HISTORY_DIR
        value: /var/data/history
      - key: CACHE_DIR
        value: /var/data/cache
      - key: SCAN_DATABASE_PATH
        value: /var/data/scan_store.sqlite
      - key: AUTH_SESSION_TTL_HOURS
        value: 168
      - key: MARKET_DATA_CACHE_TTL_SECONDS
        value: 60
      - key: PROVIDER_TIMEOUT_SECONDS
        value: 12
      - key: PROVIDER_TOTAL_TIMEOUT_SECONDS
        value: 20
      - key: PROVIDER_RETRY_COUNT
        value: 2
      - key: PROVIDER_RETRY_BACKOFF_SECONDS
        value: 0.35
      - key: PROVIDER_RETRY_STRATEGY
        value: exponential
      - key: PROVIDER_RETRY_MAX_BACKOFF_SECONDS
        value: 1.5
      - key: PROVIDER_CONTRACTS_CACHE_TTL_SECONDS
        value: 120
      - key: PROVIDER_SNAPSHOTS_CACHE_TTL_SECONDS
        value: 45
      - key: PROVIDER_UNDERLYING_CACHE_TTL_SECONDS
        value: 15
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: SENTRY_DSN
        sync: false