services:
  - type: web
    runtime: docker
    name: options-trading-backend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: options-trading-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HISTORY_DIR
        value: /var/data/history
      - key: CACHE_DIR
        value: /var/data/cache
      - key: SCAN_DATABASE_PATH
        value: /var/data/scan_store.sqlite
      - key: AUTH_SESSION_TTL_HOURS
        value: 168
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_DATA_BASE_URL
        value: https://data.alpaca.markets
      - key: ALPACA_TRADING_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: SENTRY_DSN
        sync: false