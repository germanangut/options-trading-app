system:
  name: options-trading-app

components:
  backend_api:
    type: containerized Python API application
    entrypoints:
      api: backend.api.main:app
    runtime:
      image_source: Dockerfile
      default_command: uvicorn backend.api.main:app --host 0.0.0.0 --port ${PORT:-8000}
    state: stateless compute with filesystem-backed runtime data

  frontend_web:
    type: static React application
    runtime:
      platform: vercel
      build_command: npm run build
      output_directory: dist

  data_provider:
    type: external API integration
    name: Alpaca
    role: market data and options contract provider
    dependency_mode: optional at runtime
    fallback: built-in mock data when credentials are not configured

  storage:
    type: filesystem-backed SQLite persistence
    stateful_parts:
      - SQLite database file for scans and auth sessions
      - history directory for compatibility and historical context
      - cache directory for cached market data
    access_mode: mounted disk in Render plus local directories in development

interfaces:
  backend_api:
    type: web API
    framework: FastAPI
    port: 8000
    protocol: http
  frontend_ui:
    type: web UI
    framework: React + Vite
    deployment_platform: Vercel

environment:
  required: []
  optional:
    - APP_ENV
    - LOG_LEVEL
    - LOG_FORMAT
    - SENTRY_DSN
    - ALPACA_API_KEY
    - ALPACA_API_SECRET
    - ALPACA_DATA_BASE_URL
    - ALPACA_TRADING_BASE_URL
    - HISTORY_DIR
    - CACHE_DIR
    - SCAN_DATABASE_PATH
    - AUTH_SESSION_TTL_HOURS
    - CORS_ALLOW_ORIGINS
    - CORS_ALLOW_ORIGIN_REGEX
    - VITE_API_BASE_URL
    - VITE_AUTH_TOKEN_STORAGE_KEY

deployment:
  model: split frontend/backend cloud deployment
  targets:
    backend: Render
    frontend: Vercel
  scaling:
    current: single instance
    mode: manual
  state:
    backend_container: stateless
    render_disk: stateful
  local_runtime:
    orchestrator: docker compose
    service_count: 1
  auto_deploy:
    source: GitHub
    branch: main

ci_cd:
  workflow: .github/workflows/ci.yml
  pipeline_steps:
    - checkout repository
    - install Python dependencies
    - validate Python source compilation
    - run unit tests with pytest
    - build Docker image for validation

future:
  possible_targets:
    - managed database backend
    - richer multi-environment deployment model
    - managed container + preview environment strategy
  likely_extensions:
    - external persistent database replacing SQLite
    - secret-managed environment variable injection
    - deployment promotion workflows after the fast path is proven
