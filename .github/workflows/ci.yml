name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python quality checks
    runs-on: ubuntu-latest
    env:
      ALPACA_API_KEY: ""
      ALPACA_API_SECRET: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate Python source compilation
        run: python -m compileall .

      - name: Run unit test suite
        shell: bash
        run: |
          if [ -d tests ] || compgen -G "test_*.py" > /dev/null; then
            python -m pytest -q
          else
            echo "No tests discovered yet. Add tests to extend CI coverage."
          fi

  frontend:
    name: Frontend build validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend production build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image from Dockerfile
        run: docker build --file Dockerfile --tag options-trading-app:ci .
